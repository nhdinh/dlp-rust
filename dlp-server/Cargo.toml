[package]
name = "dlp-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DLP central management and policy engine server — audit store, agent registry, ABAC engine, SIEM relay, admin API"

[dependencies]
# Shared types
dlp-common = { path = "../dlp-common" }

# Web server
axum = { version = "0.8", features = ["macros"] }
axum-core = { version = "0.1", features = [] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# HTTP types
http = "1"

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# HTTP client (SIEM relay, alerts)
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }

# URL parsing (TM-02 webhook_url SSRF validation in admin_api)
url = "2"

# Email (alert router)
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }

# Hot-reload / file watching
notify = { workspace = true }

# LDAP client (AD integration)
ldap3 = { workspace = true }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Secrets-at-rest cryptography
# Phase 47 HARD-01 — encryption at rest. All pinned to MSRV <= 1.60 to respect project MSRV 1.75 floor (47-RESEARCH §A.3).
aes-gcm = { version = "0.10.3", features = ["std", "zeroize"] }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
hmac = "0.12.1"
sha2 = "0.10.8"
zeroize = { version = "1.8.2", features = ["derive"] }

# Phase 61 — Approval Workflow Engine: Ed25519 JWT signing for approval tokens
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
hex = "0.4"

# Concurrency
parking_lot = { workspace = true }
dashmap = "6"

# Async utilities
async-trait = "0.1"

# Rate limiting
governor = "0.10"
tower_governor = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
] }

# Sensitive data protection (SMTP password, credentials)
secrecy = { workspace = true }

# Interactive password prompt (first-run admin setup)
rpassword = "5"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"], default-features = false }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tempfile = "3"
axum = { version = "0.8", features = ["macros"] }
