name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    name: Test Workspace
    runs-on: windows-latest
    needs: []
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: i686-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --version 0.21.2 --locked
          # cargo-audit 0.21.2 does not parse CVSS:4.0 entries in the upstream
          # advisory DB. Strip those lines so the DB loads, then run the audit.
          cargo audit fetch
          Get-ChildItem -Path ~/.cargo/advisory-db -Recurse -Filter *.md | ForEach-Object {
            (Get-Content $_.FullName) -notmatch '^cvss\s*=\s*"CVSS:4\.0' | Set-Content -Path $_.FullName -NoNewline
          }
          cargo audit --json --no-fetch | Out-File -FilePath cargo-audit.json -Encoding utf8
          $json = Get-Content cargo-audit.json | ConvertFrom-Json
          if ($json.vulnerabilities.count -gt 0) {
            Write-Error "cargo-audit found $($json.vulnerabilities.count) vulnerability(s)"
            exit 1
          }
        shell: pwsh
        continue-on-error: false

      - name: Build workspace (zero warnings)
        run: cargo build --workspace
        env:
          RUSTFLAGS: "-D warnings"

      - name: Build x86 hook DLL
        run: cargo build --target i686-pc-windows-msvc -p dlp-hook-dll
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace
        env:
          RUSTFLAGS: "-D warnings"
