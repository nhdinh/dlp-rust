[package]
name = "dlp-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = { workspace = true }
# Phase 63 — SHA-256 hash chain for tamper-evident audit logging
sha2 = "0.10"
hex = "0.4"
tokio = { workspace = true }
ldap3 = { workspace = true }
ipnetwork = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# Phase 47 (Task 47-05) — wrap LDAP bind credentials so the Debug derive
# redacts the password and accidental log lines reveal "[REDACTED]" rather
# than the plaintext bind secret.
secrecy = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_ActiveDirectory",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    # Phase 38.2: CM_Get_Device_Interface_PropertyW + DEVPKEY_Device_InstanceId.
    "Win32_Devices_Properties",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    # Phase 62: DPAPI CryptProtectData / CryptUnprotectData for agent offline queue
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tokio = { workspace = true }
bincode = "1.3"
